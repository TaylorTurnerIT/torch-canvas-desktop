[package]
name = "torch-canvas-desktop"
version = "0.1.0"
description = "Desktop port of Torch Canvas by Jesse Roberts"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
lto = true
codegen-units = 1
strip = "none"
